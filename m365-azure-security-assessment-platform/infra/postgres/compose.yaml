services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: m365_platform
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in the local environment}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - platform-postgres-data:/var/lib/postgresql/data
      - ../../api/M365.SecurityAssessment.Persistence/Migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d m365_platform"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  platform-postgres-data: